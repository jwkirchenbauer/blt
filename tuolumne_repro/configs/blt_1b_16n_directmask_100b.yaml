# 16-node systems candidate that preserves one optimizer microbatch:
#   64 ranks * 16 sequences * 4096 patches = 4,194,304 patches/update.
#
# This shape requires BLT_DIRECT_BLOCK_MASK=1 on Tuolumne. The flag changes
# only BlockMask metadata construction; the elementwise attention relation is
# unchanged.
config: tuolumne_repro/configs/blt_1b_32n_100b.yaml

distributed:
  dp_replicate: 64

data:
  batch_size: 16

grad_acc_steps: 1
